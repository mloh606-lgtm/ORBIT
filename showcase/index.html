<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit | Interactive Showcase</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#17253d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#101e38;color:white;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.logo{font-size:26px;font-weight:850;letter-spacing:-1px}.logo span{color:#78d5fa}.sub{font-size:12px;color:#b8c7dd}nav{display:flex;gap:8px;padding:14px 24px;overflow:auto;background:white;border-bottom:1px solid #e4eaf3}nav button{white-space:nowrap;border:0;background:#edf2f8;color:#43516a;border-radius:9px;padding:11px 17px;font-weight:650}nav button.active{background:#205bd4;color:white}main{padding:24px;max-width:1480px;margin:auto}h1{font-size:26px;margin:0 0 7px}p.muted{color:#718096;margin:0 0 22px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:20px 0}.stat,.panel,.card{background:white;border:1px solid #e2e8f2;border-radius:14px;padding:20px;box-shadow:0 4px 15px #182e4910}.stat strong{display:block;font-size:29px;margin-top:7px}.stat small{color:#6c7b91}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.panel h2{font-size:17px;margin:0 0 16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.toolbar input,.toolbar select,.form input,.form select{padding:10px;border:1px solid #d9e2ee;border-radius:8px;background:white;max-width:100%}.primary{background:#205bd4;color:white;border:0;border-radius:9px;padding:11px 16px;font-weight:650}.secondary{background:#e9eff9;color:#28466d;border:0;border-radius:9px;padding:10px 13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:630px}th,td{padding:13px 10px;border-bottom:1px solid #edf1f6;text-align:left;font-size:13px}th{color:#748299;font-weight:700;background:#f9fbfe}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef3ff;color:#2557a8;font-size:11px;font-weight:700}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.people{display:flex;gap:9px;flex-wrap:wrap}.person{display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid #e3eaf4;border-radius:30px;background:white;font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-height:102px;border:1px solid #e5ebf4;border-radius:8px;padding:7px;overflow:hidden;background:#fff}.day .n{font-size:12px;color:#64748b;font-weight:700}.day.today{border:2px solid #205bd4}.event{display:block;font-size:10px;padding:4px;margin-top:5px;border-radius:4px;background:#eef4ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid}.kanban{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:15px;overflow:auto}.lane{background:#eaf0f7;padding:12px;border-radius:12px;min-height:330px}.lane h3{font-size:14px}.task{background:white;padding:13px;margin:10px 0;border-radius:10px;border:1px solid #dfe7f1;box-shadow:0 2px 7px #182e4910}.task b{font-size:13px}.task p{font-size:12px;color:#69788c;margin:8px 0}.task select{width:100%;padding:6px;border:1px solid #e2e8f0;border-radius:7px;font-size:12px}.gantt{overflow:auto}.ganttgrid{min-width:920px}.grow{display:grid;grid-template-columns:220px repeat(14,minmax(45px,1fr));border-bottom:1px solid #e5eaf2;align-items:center;min-height:47px;font-size:11px}.grow>div{padding:7px;border-right:1px solid #edf1f6;min-height:42px}.bar{height:19px;border-radius:5px;opacity:.9}.form{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.form input{flex:1;min-width:150px}.empty{color:#718096;font-size:13px}.banner{background:#fff4df;color:#835315;border:1px solid #f4dda8;border-radius:9px;padding:10px 14px;font-size:12px}footer{text-align:center;color:#8290a3;font-size:12px;padding:30px}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}main{padding:14px}.day{min-height:75px;padding:4px}.event{font-size:9px}.kanban{grid-template-columns:repeat(3,250px)}}@media(max-width:480px){.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:23px}.calendar{gap:2px}.day{min-height:67px}.event{padding:2px}}
</style></head><body><header><div><div class="logo">◉ OR<span>BIT</span> <small style="font-size:12px;background:#315178;padding:5px 8px;border-radius:5px;vertical-align:middle">SHOWCASE</small></div><div class="sub">Team workspace · Customers · Calendar · Agile delivery</div></div><div class="people" id="people"></div></header><nav id="nav"></nav><main><div class="banner">Interactive demonstration with fictional customers and staff. Changes are saved only in this browser, not shared with the live Orbit system.</div><div id="app" style="margin-top:22px"></div></main><footer>ORBIT DEMO · Independent sample data · No login required</footer><script>
const users=[{name:'Meng',color:'#2663df'},{name:'Aisha',color:'#e76f51'},{name:'Daniel',color:'#15a884'},{name:'Priya',color:'#a25ddc'},{name:'Jason',color:'#e3a129'}];
const today=new Date();today.setHours(12,0,0,0);const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};const shift=n=>{let d=new Date(today);d.setDate(d.getDate()+n);return iso(d)};
const seed={customers:[{id:1,name:'Northstar Retail',industry:'Retail',contact:'Sarah Lim',email:'sarah@example.com',stage:'Active'},{id:2,name:'Meridian Logistics',industry:'Logistics',contact:'Adam Wong',email:'adam@example.com',stage:'Active'},{id:3,name:'Bluepeak Technologies',industry:'Technology',contact:'Farah Tan',email:'farah@example.com',stage:'Prospect'},{id:4,name:'Cedar Healthcare',industry:'Healthcare',contact:'Kevin Lee',email:'kevin@example.com',stage:'Active'},{id:5,name:'Horizon Foods',industry:'FMCG',contact:'Nadia Rahman',email:'nadia@example.com',stage:'Prospect'},{id:6,name:'Summit Properties',industry:'Property',contact:'Elaine Ong',email:'elaine@example.com',stage:'Active'}],tasks:[{id:1,title:'Client discovery workshop',customer:1,owner:0,start:shift(-3),due:shift(1),status:'In Progress',priority:'High'},{id:2,title:'Prepare implementation proposal',customer:2,owner:1,start:shift(-1),due:shift(5),status:'To Do',priority:'High'},{id:3,title:'Review product requirements',customer:3,owner:2,start:shift(-5),due:shift(2),status:'In Progress',priority:'Medium'},{id:4,title:'Present quarterly review',customer:4,owner:3,start:shift(-8),due:shift(-1),status:'Done',priority:'Medium'},{id:5,title:'Follow up on contract',customer:5,owner:4,start:shift(0),due:shift(4),status:'To Do',priority:'High'},{id:6,title:'Stakeholder interviews',customer:6,owner:0,start:shift(2),due:shift(9),status:'To Do',priority:'Medium'},{id:7,title:'Complete pilot feedback',customer:1,owner:1,start:shift(-4),due:shift(3),status:'In Progress',priority:'Low'},{id:8,title:'Send revised commercial offer',customer:2,owner:2,start:shift(-6),due:shift(-2),status:'Done',priority:'High'},{id:9,title:'Schedule onboarding',customer:4,owner:4,start:shift(1),due:shift(7),status:'To Do',priority:'Medium'}]};
let data;try{data=JSON.parse(localStorage.getItem('orbit_showcase_v1'))||structuredClone(seed)}catch(e){data=JSON.parse(JSON.stringify(seed))}let view='Overview',month=new Date(today.getFullYear(),today.getMonth(),1),search='';const save=()=>localStorage.setItem('orbit_showcase_v1',JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cname=id=>data.customers.find(c=>c.id==id)?.name||'Unknown';const person=i=>'<span class="dot" style="background:'+users[i].color+'"></span>'+users[i].name;const status=s=>'<span class="pill">'+esc(s)+'</span>';const customerOptions=()=>data.customers.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');const userOptions=()=>users.map((u,i)=>'<option value="'+i+'">'+esc(u.name)+'</option>').join('');const setView=v=>{view=v;render()};function render(){document.getElementById('people').innerHTML=users.map((u,i)=>'<span class="person">'+person(i)+'</span>').join('');document.getElementById('nav').innerHTML=['Overview','Calendar','Customers','Tasks','Gantt'].map(v=>'<button class="'+(view===v?'active':'')+'" onclick="setView(\''+v+'\')">'+v+'</button>').join('');document.getElementById('app').innerHTML=({Overview:overview,Calendar:calendar,Customers:customers,Tasks:tasks,Gantt:gantt})[view]()}
function heading(title,subtitle){return '<h1>'+title+'</h1><p class="muted">'+subtitle+'</p>'}
function overview(){let done=data.tasks.filter(t=>t.status==='Done').length;return heading('Team at a glance','A connected picture of customers, responsibilities and upcoming work')+'<div class="stats"><div class="stat"><small>Customers</small><strong>'+data.customers.length+'</strong></div><div class="stat"><small>Open activities</small><strong>'+(data.tasks.length-done)+'</strong></div><div class="stat"><small>Completed tasks</small><strong>'+done+'</strong></div><div class="stat"><small>Team members</small><strong>5</strong></div></div><div class="two"><div class="panel"><h2>Upcoming customer activities</h2>'+taskTable(data.tasks.filter(t=>t.status!=='Done').sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6))+'</div><div class="panel"><h2>Work distribution</h2>'+users.map((u,i)=>{let n=data.tasks.filter(t=>t.owner===i&&t.status!=='Done').length;return '<div style="margin:15px 0">'+person(i)+' <b style="float:right">'+n+' open</b><div style="background:#e9eef7;height:9px;border-radius:8px;margin-top:9px"><div style="background:'+u.color+';width:'+(n/Math.max(1,data.tasks.length)*100)+'%;height:9px;border-radius:8px"></div></div></div>'}).join('')+'<button class="secondary" onclick="setView(\'Gantt\')">View project timeline</button></div></div>'}
function taskTable(rows){return '<div class="tablewrap"><table><thead><tr><th>Activity</th><th>Customer</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>'+rows.map(t=>'<tr><td><b>'+esc(t.title)+'</b></td><td>'+esc(cname(t.customer))+'</td><td>'+person(t.owner)+'</td><td>'+t.due+'</td><td>'+status(t.status)+'</td></tr>').join('')+'</tbody></table></div>'}
function calendar(){let year=month.getFullYear(),m=month.getMonth(),first=new Date(year,m,1).getDay(),days=new Date(year,m+1,0).getDate();let cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let date=iso(new Date(year,m,d)),events=data.tasks.filter(t=>t.due===date);cells+='<div class="day '+(date===iso(today)?'today':'')+'"><span class="n">'+d+'</span>'+events.map(t=>'<span class="event" title="'+esc(t.title)+' — '+esc(cname(t.customer))+'" style="border-color:'+users[t.owner].color+'">'+esc(t.title)+'</span>').join('')+'</div>'}return heading('Team calendar','Every customer activity appears on its due date, colour-coded by team member')+'<div class="panel"><div class="toolbar"><button class="secondary" onclick="moveMonth(-1)">← Previous</button><h2 style="margin:0">'+month.toLocaleString('en-MY',{month:'long',year:'numeric'})+'</h2><button class="secondary" onclick="moveMonth(1)">Next →</button><button class="secondary" onclick="month=new Date(today.getFullYear(),today.getMonth(),1);render()">Today</button></div><div class="calendar">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>'<div style="font-size:12px;font-weight:700;text-align:center;padding:8px">'+x+'</div>').join('')+cells+'</div></div>'}
function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function customers(){let filtered=data.customers.filter(c=>(c.name+' '+c.contact+' '+c.industry).toLowerCase().includes(search.toLowerCase()));return heading('Customer records','Each customer has an activity history and linked team assignments')+'<div class="panel"><div class="toolbar"><input placeholder="Search customers" value="'+esc(search)+'" oninput="search=this.value;render()"><button class="primary" onclick="addCustomer()">+ Add customer</button></div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Industry</th><th>Contact</th><th>Relationship</th><th>Activities</th><th></th></tr></thead><tbody>'+filtered.map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.industry)+'</td><td>'+esc(c.contact)+'</td><td>'+status(c.stage)+'</td><td>'+data.tasks.filter(t=>t.customer===c.id).length+'</td><td><button class="secondary" onclick="showCustomer('+c.id+')">Open record</button></td></tr>').join('')+'</tbody></table></div></div><div id="detail"></div>'}
function showCustomer(id){let c=data.customers.find(x=>x.id===id);document.getElementById('detail').innerHTML='<div class="panel" style="margin-top:15px"><h2>'+esc(c.name)+'</h2><p class="muted">'+esc(c.industry)+' · '+esc(c.contact)+' · '+esc(c.email)+'</p><h2>Activity history</h2>'+taskTable(data.tasks.filter(t=>t.customer===id))+'<button class="primary" style="margin-top:14px" onclick="addTask('+id+')">+ Add customer activity</button></div>'}
function tasks(){return heading('Agile task board','Move work between stages; updates also appear in the calendar and Gantt view')+'<div class="toolbar"><button class="primary" onclick="addTask()">+ New activity</button><button class="secondary" onclick="resetDemo()">Reset sample data</button></div><div class="kanban">'+['To Do','In Progress','Done'].map(s=>'<div class="lane"><h3>'+s+' · '+data.tasks.filter(t=>t.status===s).length+'</h3>'+data.tasks.filter(t=>t.status===s).map(t=>'<div class="task"><b>'+esc(t.title)+'</b><p>'+esc(cname(t.customer))+'</p><p>'+person(t.owner)+' · Due '+t.due+'</p><p>'+status(t.priority)+'</p><select aria-label="Move task status" onchange="changeStatus('+t.id+',this.value)">'+['To Do','In Progress','Done'].map(x=>'<option '+(s===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>').join('')+'</div>').join('')+'</div>'}
function changeStatus(id,status){data.tasks.find(t=>t.id===id).status=status;save();render()}
function gantt(){let dates=Array.from({length:14},(_,i)=>shift(i-4));let rows='<div class="grow"><div><b>Customer activity</b></div>'+dates.map(d=>'<div>'+d.slice(5)+'</div>').join('')+'</div>';data.tasks.forEach(t=>{rows+='<div class="grow"><div><b>'+esc(t.title)+'</b><div style="color:#8290a3">'+esc(cname(t.customer))+'</div></div>';dates.forEach(d=>{let active=d>=t.start&&d<=t.due;rows+='<div>'+(active?'<div class="bar" title="'+esc(t.title)+'" style="background:'+users[t.owner].color+'"></div>':'')+'</div>'});rows+='</div>'});return heading('Gantt delivery timeline','A 14-day view of activities, ownership and planned duration')+'<div class="panel"><div class="people" style="margin-bottom:15px">'+users.map((u,i)=>'<span class="person">'+person(i)+'</span>').join('')+'</div><div class="gantt"><div class="ganttgrid">'+rows+'</div></div></div>'}
function addCustomer(){let name=prompt('Customer organisation name');if(!name?.trim())return;let industry=prompt('Industry','Services')||'Services',contact=prompt('Contact person','New contact')||'New contact';data.customers.push({id:Date.now(),name:name.trim(),industry,contact,email:'',stage:'Prospect'});save();render()}
function addTask(customer){let title=prompt('New activity / task');if(!title?.trim())return;let customerId=customer||Number(prompt('Customer ID:\n'+data.customers.map(c=>c.id+' = '+c.name).join('\n'),data.customers[0]?.id));if(!data.customers.some(c=>c.id===customerId)){alert('Please select a valid customer ID');return}let owner=Number(prompt('Owner: 0 Meng, 1 Aisha, 2 Daniel, 3 Priya, 4 Jason','0'));if(!users[owner])owner=0;let due=prompt('Due date (YYYY-MM-DD)',shift(3));if(!/^\d{4}-\d{2}-\d{2}$/.test(due||'')){alert('Please enter a valid date format');return}data.tasks.push({id:Date.now(),title:title.trim(),customer:customerId,owner,start:iso(today),due,status:'To Do',priority:'Medium'});save();render()}
function resetDemo(){if(confirm('Restore all original fictional demo data?')){data=JSON.parse(JSON.stringify(seed));save();render()}}render();
</script></body></html>
