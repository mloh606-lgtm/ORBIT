(()=>{'use strict';
const STORAGE='orbit_team_organiser_v3_cloud_cache';const COLORS=['#7762D9','#E8954F','#26A99B','#DE6C95','#4E8DD7'];

const TODAY=localDate(new Date());let state={view:'calendar',selectedDate:TODAY,monthCursor:TODAY.slice(0,7),calendarMode:'month',teamFilter:'all',customerQuery:'',customerStatus:'all',activityQuery:'',activityFilter:'all',detailId:null,workMode:'gantt',workTeam:'all',workCustomer:'all',workAnchor:TODAY,workSpan:35,workSprint:'',workIncludeMeetings:false};let data;let sampleVisible=false;
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function localDateTime(d){return localDate(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')}

function customer(id){return data.customers.find(c=>c.id===id)}
const AGILE_STAGES=['Backlog','To do','In progress','Review','Done'];const WORK_TYPES=['To-do','Deadline','Follow-up'];const PROGRESS_BY_STAGE={'Backlog':0,'To do':10,'In progress':50,'Review':85,'Done':100};
function stageOf(a){return a.stage&&[...AGILE_STAGES,'Cancelled'].includes(a.stage)?a.stage:(a.status==='Done'?'Done':a.status==='Cancelled'?'Cancelled':a.status==='In progress'?'In progress':'To do')}
function fromStage(stage){return stage==='Done'?'Done':stage==='Cancelled'?'Cancelled':stage==='In progress'||stage==='Review'?'In progress':'Planned'}
function normaliseAgile(obj){if(!Array.isArray(obj.sprints))obj.sprints=[];obj.activities.forEach(a=>{a.stage=stageOf(a);a.startDate=(a.startDate&&/^\d{4}-\d\d-\d\d$/.test(a.startDate)&&a.startDate<=a.date)?a.startDate:a.date;a.priority=['Low','Normal','High','Critical'].includes(a.priority)?a.priority:'Normal';a.storyPoints=Number.isFinite(Number(a.storyPoints))?Math.max(0,Math.min(100,Number(a.storyPoints))):0;a.progress=Number.isFinite(Number(a.progress))?Math.max(0,Math.min(100,Number(a.progress))):PROGRESS_BY_STAGE[a.stage]||0;if(a.stage==='Done')a.progress=100;a.blocked=Boolean(a.blocked);a.sprintId=obj.sprints.some(x=>x.id===a.sprintId)?a.sprintId:'';a.dependsOn=obj.activities.some(x=>x.id===a.dependsOn&&x.id!==a.id)?a.dependsOn:'';a.status=fromStage(a.stage)});return obj}

function mkSample(){const members=COLORS.map((color,i)=>({id:'m'+(i+1),name:i===0?'You':'Member '+(i+1),color}));const customers=[{id:'c1',name:'Northstar Digital',contact:'Aisha Tan',email:'aisha@example.com',phone:'',status:'Active',notes:'Sample customer – replace with your own.'},{id:'c2',name:'Meridian Retail',contact:'Daniel Lim',email:'daniel@example.com',phone:'',status:'Prospect',notes:'Sample customer.'},{id:'c3',name:'Crescent Logistics',contact:'Priya Nair',email:'priya@example.com',phone:'',status:'Active',notes:'Sample customer.'},{id:'c4',name:'Horizon Services',contact:'Marcus Lee',email:'marcus@example.com',phone:'',status:'On hold',notes:'Sample customer.'}];const a=(id,offset,title,type,cid,creator,time='',status='Planned')=>({id,date:shiftDays(TODAY,offset),time,title,type,customerId:cid,createdBy:creator,ownerId:creator,status,location:'',notes:'',createdAt:new Date().toISOString()});const activities=[a('a1',0,'Review service proposal','Meeting','c1','m1','10:00'),a('a2',0,'Send meeting recap','To-do','c1','m2','14:00'),a('a3',1,'Discovery call','Call','c2','m3','09:30'),a('a4',3,'Prepare account plan','To-do','c3','m1',''),a('a5',5,'Quarterly account review','Meeting','c3','m4','11:00'),a('a6',-2,'Send updated quotation','Follow-up','c4','m5','16:00'),a('a7',-4,'Client briefing completed','Meeting','c1','m2','15:00','Done'),a('a8',8,'Renewal checkpoint','Deadline','c1','m5','')];const sprints=[{id:'sp_demo_1',name:'Sprint 01 · Customer follow-through',startDate:shiftDays(TODAY,-7),endDate:shiftDays(TODAY,6),goal:'Close customer commitments and handovers.'},{id:'sp_demo_2',name:'Sprint 02 · Account development',startDate:shiftDays(TODAY,7),endDate:shiftDays(TODAY,20),goal:'Prepare renewals and priority account actions.'}];activities.forEach((a,i)=>{a.startDate=shiftDays(a.date,-(i%4));a.stage=['In progress','To do','Backlog','In progress','Review','To do','Done','Backlog'][i];a.status=fromStage(a.stage);a.priority=['High','Normal','Low','Critical','Normal','High','Normal','High'][i];a.storyPoints=[3,2,2,5,3,2,1,5][i];a.progress=PROGRESS_BY_STAGE[a.stage];a.blocked=i===5;a.sprintId=i<6?sprints[0].id:sprints[1].id;a.dependsOn=i===3?'a2':''});return {version:2,members,customers,activities,notes:[],sprints,activeUserId:'m1',isSample:true}}

function stats(){const open=data.activities.filter(a=>a.type==='To-do'&&a.status!=='Done'&&a.status!=='Cancelled').length;const future=data.activities.filter(a=>a.date>=TODAY&&a.status!=='Cancelled'&&a.status!=='Done').length;const thisMonth=data.activities.filter(a=>a.date.startsWith(state.monthCursor)).length;return [{title:'Customers',count:data.customers.filter(c=>c.status!=='Closed').length,foot:'Open customer records',icon:'♧'},{title:'Upcoming activities',count:future,foot:'From today onwards',icon:'◷'},{title:'Open to-dos',count:open,foot:'Across all team members',icon:'☑'},{title:'This calendar month',count:thisMonth,foot:niceDate(state.monthCursor+'-01',{month:'long',year:'numeric'}),icon:'▦'}]}

function render(){renderChrome();let main=document.getElementById('main');let banner=data.isSample?'<div class="sample-strip">✦ This workspace contains <strong>example customers and activities</strong> so you can explore it. <button data-action="clear-sample">Start with an empty workspace</button></div>':'';main.innerHTML=banner+({calendar:renderCalendar,work:renderWorkViews,customers:renderCustomers,activities:renderActivities,team:renderTeam,data:renderData})[state.view]();cloudBadge()}
function renderStats(){return '<div class="stats">'+stats().map(s=>'<div class="stat"><div class="stat-head">'+s.title+'<span class="stat-icon">'+s.icon+'</span></div><div class="stat-value">'+s.count+'</div><div class="stat-foot">'+html(s.foot)+'</div></div>').join('')+'</div>'}
function renderCalendar(){const monthStart=state.monthCursor+'-01';const sel=state.selectedDate;const monthLabel=niceDate(monthStart,{month:'long',year:'numeric'});let cells=[];if(state.calendarMode==='month'){const first=dateObj(monthStart),offset=(first.getDay()+6)%7,start=shiftDays(monthStart,-offset);const last=dateObj(state.monthCursor+'-01');last.setMonth(last.getMonth()+1);last.setDate(0);const daysInMonth=last.getDate(),weekCount=Math.ceil((offset+daysInMonth)/7);for(let i=0;i<weekCount*7;i++)cells.push(shiftDays(start,i))}else{const d=dateObj(sel),start=shiftDays(sel,-((d.getDay()+6)%7));for(let i=0;i<7;i++)cells.push(shiftDays(start,i))}
const events=getItems();const byDate={};events.forEach(a=>(byDate[a.date]??=[]).push(a));Object.keys(byDate).forEach(k=>byDate[k]=sortedActivities(byDate[k]));
const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>'<div class="weekday">'+w+'</div>').join('');const grid=cells.map(day=>{const entries=byDate[day]||[];const outside=!day.startsWith(state.monthCursor);return '<div class="day '+(outside?'outside ':'')+(day===TODAY?'today ':'')+(day===sel?'selected':'')+'" data-action="select-day" data-date="'+day+'" role="button" tabindex="0" aria-label="'+html(niceDate(day))+'"><div class="day-num">'+Number(day.slice(8))+'</div>'+entries.slice(0,state.calendarMode==='month'?3:10).map(a=>'<button class="event-pill '+(a.status==='Done'?'done':'')+'" title="'+html(a.title)+'" data-action="edit-activity" data-id="'+html(a.id)+'">'+dot(a.createdBy)+'<span>'+html(a.title)+'</span></button>').join('')+(entries.length>(state.calendarMode==='month'?3:10)?'<div class="more-events">+'+(entries.length-(state.calendarMode==='month'?3:10))+' more</div>':'')+'</div>'}).join('');
const todayEntries=byDate[sel]||[];const upcoming=sortedActivities(events.filter(a=>a.date>TODAY&&a.status!=='Done'&&a.status!=='Cancelled')).slice(0,5);
return '<div class="welcome"><div><h2>Your team, customers, and commitments</h2><p class="subtext">One calendar. Every activity connected to the customer record.</p></div><button class="btn" data-action="today">Today</button></div>'+renderStats()+'<div class="panels"><section class="panel"><div class="panel-header"><div><h2 class="panel-title">'+html(monthLabel)+'</h2><div class="micro">Click a date to see the day’s schedule</div></div><div class="month-toolbar"><button class="icon-btn" aria-label="Previous '+state.calendarMode+'" data-action="prev-period">‹</button><button class="icon-btn" aria-label="Next '+state.calendarMode+'" data-action="next-period">›</button><div class="mode-toggle"><button class="'+(state.calendarMode==='month'?'active':'')+'" data-action="mode" data-mode="month">Month</button><button class="'+(state.calendarMode==='week'?'active':'')+'" data-action="mode" data-mode="week">Week</button></div></div></div><div class="calendar-tools"><div class="legend">'+data.members.map(m=>'<span>'+dot(m.id)+html(m.name)+'</span>').join('')+'</div><select class="filter-input" id="calendarTeamFilter" aria-label="Filter calendar by creator"><option value="all">Everyone’s activities</option>'+data.members.map(m=>'<option value="'+m.id+'" '+(state.teamFilter===m.id?'selected':'')+'>'+html(m.name)+'</option>').join('')+'</select></div><div class="calendar-grid '+(state.calendarMode==='week'?'week-grid':'')+'">'+days+grid+'</div></section><aside class="panel"><div class="panel-header"><h2 class="panel-title">Day agenda</h2><button class="btn mini" data-action="add-activity" data-date="'+sel+'">＋ Add</button></div><div class="side-section"><div class="micro">'+html(niceDate(sel,{weekday:'long'}))+'</div><div class="side-date">'+html(niceDate(sel,{day:'numeric',month:'long'}))+'</div><div class="micro">'+todayEntries.length+' activit'+(todayEntries.length===1?'y':'ies')+' scheduled</div>'+(todayEntries.length?todayEntries.map(a=>'<div class="agenda-entry"><div class="agenda-when">'+html(a.time||'All day')+'</div><div class="agenda-body"><button class="title-link" data-action="edit-activity" data-id="'+a.id+'">'+dot(a.createdBy)+html(a.title)+'</button><div class="agenda-sub">'+html(customer(a.customerId)?.name||'Internal')+' · '+html(a.type)+' · '+html(member(a.createdBy).name)+'</div></div>'+(a.type==='To-do'?'<button class="tiny-check '+(a.status==='Done'?'complete':'')+'" data-action="toggle-done" data-id="'+a.id+'" title="Toggle complete">'+(a.status==='Done'?'✓':'○')+'</button>':'')+'</div>').join(''):'<div class="placeholder"><span class="empty-icon">◷</span>No activities on this date.<br>Choose <strong>+ Add</strong> to schedule one.</div>')+'</div><div class="side-section"><div class="side-top"><h3 class="panel-title">Coming up</h3><button class="btn ghost mini" data-action="nav" data-view="activities">View all</button></div>'+(upcoming.length?upcoming.map(a=>'<div class="upcoming"><div class="date-chip"><b>'+Number(a.date.slice(8))+'</b><span>'+niceDate(a.date,{month:'short'})+'</span></div><div style="min-width:0"><button data-action="edit-activity" data-id="'+a.id+'">'+dot(a.createdBy)+html(a.title)+'</button><small>'+html(customer(a.customerId)?.name||'Internal')+' · '+html(member(a.createdBy).name)+'</small></div></div>').join(''):'<p class="subtext" style="margin-top:14px">No future activities found.</p>')+'</div></aside></div>'}
function renderCustomers(){const q=state.customerQuery.toLowerCase();const rows=data.customers.filter(c=>(state.customerStatus==='all'||c.status===state.customerStatus)&&[c.name,c.contact,c.email,c.phone,c.notes].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));return '<div class="welcome"><div><h2>Keep the whole customer story in one place</h2><p class="subtext">Contact information, dated activity history, and team notes.</p></div><button class="btn primary" data-action="add-customer">＋ Add customer</button></div><div class="section-toolbar"><input class="search" id="customerSearch" placeholder="Search customers, contacts, or notes…" value="'+html(state.customerQuery)+'" aria-label="Search customer records"><div class="toolbar-right"><select class="filter-input" id="customerStatus"><option value="all">All statuses</option>'+['Prospect','Active','On hold','Closed'].map(s=>'<option '+(state.customerStatus===s?'selected':'')+'>'+s+'</option>').join('')+'</select><span class="micro">'+rows.length+' shown</span></div></div>'+(rows.length?'<div class="card-grid">'+rows.map(c=>{let linked=data.activities.filter(a=>a.customerId===c.id),upcoming=linked.filter(a=>a.date>=TODAY&&a.status!=='Done');return '<button class="customer-card" data-action="view-customer" data-id="'+html(c.id)+'"><div class="customer-card-top"><span class="customer-avatar">'+html(initial(c.name))+'</span><span class="status-tag '+c.status.toLowerCase().replaceAll(' ','-')+'">'+html(c.status)+'</span></div><div class="customer-name">'+html(c.name)+'</div><div class="customer-person">'+html(c.contact||'No contact yet')+'</div><div class="customer-divider"></div><div class="meta-line"><span>Recorded activities</span><strong>'+linked.length+'</strong></div><div class="meta-line"><span>Upcoming</span><strong>'+upcoming.length+'</strong></div><div class="meta-line"><span>Next event</span><strong>'+html(upcoming.length?niceDate(sortedActivities(upcoming)[0].date,{day:'numeric',month:'short'}):'—')+'</strong></div></button>'}).join('')+'</div>':'<div class="table-empty">No matching customers yet. Create one with <strong>+ Add customer</strong>.</div>')}
function renderActivities(){let q=state.activityQuery.toLowerCase();let rows=getItems().filter(a=>[a.title,a.notes,a.type,customer(a.customerId)?.name,member(a.createdBy).name].join(' ').toLowerCase().includes(q));if(state.activityFilter==='todo')rows=rows.filter(a=>a.type==='To-do'&&a.status!=='Done');if(state.activityFilter==='done')rows=rows.filter(a=>a.status==='Done');if(state.activityFilter==='overdue')rows=rows.filter(isOverdue);if(state.activityFilter==='upcoming')rows=rows.filter(a=>a.date>=TODAY&&a.status!=='Done');rows=sortedActivities(rows);return '<div class="welcome"><div><h2>Follow up without losing the context</h2><p class="subtext">Calls, meetings, deadlines and tasks with a clear owner and customer.</p></div><button class="btn primary" data-action="add-activity">＋ New activity</button></div><div class="section-toolbar"><input class="search" placeholder="Search activity or customer…" id="activitySearch" value="'+html(state.activityQuery)+'"><div class="toolbar-right"><select class="filter-input" id="activityType"><option value="all">All activities</option><option value="upcoming" '+(state.activityFilter==='upcoming'?'selected':'')+'>Upcoming</option><option value="todo" '+(state.activityFilter==='todo'?'selected':'')+'>Open to-dos</option><option value="overdue" '+(state.activityFilter==='overdue'?'selected':'')+'>Overdue</option><option value="done" '+(state.activityFilter==='done'?'selected':'')+'>Completed</option></select><select class="filter-input" id="activityTeam"><option value="all">All creators</option>'+data.members.map(m=>'<option value="'+m.id+'" '+(state.teamFilter===m.id?'selected':'')+'>'+html(m.name)+'</option>').join('')+'</select></div></div><p class="section-note">Coloured dots identify the person who created each record. Tasks can be assigned to a different owner.</p>'+(rows.length?'<div class="activity-list">'+rows.map(a=>{const stat=a.status==='Done'?'done':isOverdue(a)?'overdue':'';return '<div class="activity-row"><div class="row-icon">'+({Meeting:'▦',Call:'◉','To-do':'☑',Deadline:'⚑','Follow-up':'↗'}[a.type]||'◷')+'</div><div><button class="row-title" data-action="edit-activity" data-id="'+a.id+'">'+dot(a.createdBy)+' '+html(a.title)+'</button><div class="row-sub">'+html(customer(a.customerId)?.name||'Internal')+' · '+html(a.type)+' · Added by '+html(member(a.createdBy).name)+' · Owner: '+html(member(a.ownerId).name)+'</div></div><div class="row-date"><strong>'+html(niceDate(a.date,{day:'numeric',month:'short',year:'numeric'}))+'</strong>'+html(a.time||'All day')+'</div><span class="row-badge '+stat+'">'+html(stat==='overdue'?'Overdue':a.status)+'</span>'+(a.type==='To-do'?'<button class="tiny-check '+(a.status==='Done'?'complete':'')+'" data-action="toggle-done" data-id="'+a.id+'" title="Toggle done">'+(a.status==='Done'?'✓':'○')+'</button>':'')+'</div>'}).join('')+'</div>':'<div class="table-empty">Nothing matches these activity filters.</div>')}
function renderTeam(){return '<div class="welcome"><div><h2>Five colours. One shared view.</h2><p class="subtext">Each member signs in using their own account. Your assigned colour identifies records you create.</p></div></div><div class="team-grid">'+data.members.map((m,i)=>{const profile=member(m.id), entered=data.activities.filter(a=>a.createdBy===m.id).length,assigned=cloudRoster.find(x=>x.member_slot===i+1);return '<div class="team-card"><div class="team-avatar" style="background:'+m.color+'">'+html(initial(profile.name))+'</div><div class="team-name">'+html(profile.name)+'</div><div class="team-desc">Slot '+(i+1)+(data.activeUserId===m.id?' · You':'')+(assigned?' · '+html(assigned.role):' · Available')+'</div><div class="team-card-footer"><span>'+entered+' activit'+(entered===1?'y':'ies')+' entered</span></div></div>'}).join('')+'</div><div style="margin-top:22px" class="notice"><strong>How colours work:</strong> Every activity keeps the colour of the person who created it. Your sign-in account assigns your colour.</div>'+(cloudIsAdmin?'<p><a class="btn primary" href="./admin.html">Manage team users and access →</a></p>':'')}
function renderData(){return '<div class="welcome"><div><h2>Keep control of your records</h2><p class="subtext">Export or restore a portable copy of all customers, tasks, team names, and notes.</p></div></div><div class="data-grid view-narrow"><div class="info-panel"><h3>Backup and restore</h3><p>Download one JSON file containing the complete workspace. Import replaces the shared workspace for all authorised Orbit members. Export a backup before importing.</p><button class="btn primary" data-action="export-json">↓ Export all data</button><button class="btn" data-action="import-json">↑ Import backup</button></div><div class="info-panel"><h3>Share calendar or analyse data</h3><p>Export your customer and activity lists to CSV or events to an .ics calendar file. These exports are copies, not live synchronisation.</p><button class="btn" data-action="export-csv-customers">↓ Customers CSV</button><button class="btn" data-action="export-csv-activities">↓ Activities CSV</button><button class="btn" data-action="export-ics">↓ Calendar .ics</button></div><div class="info-panel"><h3>Workspace data</h3><p><strong>'+data.customers.length+'</strong> customers · <strong>'+data.activities.length+'</strong> activities · <strong>'+data.notes.length+'</strong> customer notes. This information is synchronised to the private Orbit workspace in Supabase after sign-in.</p><button class="btn danger" data-action="clear-all">Clear workspace</button><button class="btn" data-action="reset-sample">Load example data</button></div><div class="info-panel"><h3>Pilot limitations and safeguards</h3><p>This pilot connects to Supabase for shared data, authentication and access control. Team updates are checked approximately every 15 seconds. Export regular backups.</p><div class="notice">This is a shared pilot, not yet a production CRM. Use fictional customers for testing and verify each of the five accounts.</div></div></div>'}

// Five work perspectives all read and update the same customer-linked activities.
function sprint(id){return (data.sprints||[]).find(s=>s.id===id)}
function unfinishedDependency(a){const dep=data.activities.find(x=>x.id===a.dependsOn);return dep&&dep.status!=='Done'?dep:null}
function teamSelect(id,selected,empty='All team members'){return '<select class="filter-input" id="'+id+'" aria-label="Filter by task owner"><option value="all">'+empty+'</option>'+data.members.map(m=>'<option value="'+html(m.id)+'" '+(selected===m.id?'selected':'')+'>'+html(m.name)+'</option>').join('')+'</select>'}
function customerSelect(id,selected){return '<select class="filter-input" id="'+id+'" aria-label="Filter by customer"><option value="all">All customers</option><option value="internal" '+(selected==='internal'?'selected':'')+'>Internal / no customer</option>'+data.customers.map(c=>'<option value="'+html(c.id)+'" '+(selected===c.id?'selected':'')+'>'+html(c.name)+'</option>').join('')+'</select>'}
function workTasks(){return data.activities.filter(a=>(state.workIncludeMeetings||WORK_TYPES.includes(a.type))&&(state.workTeam==='all'||a.ownerId===state.workTeam)&&(state.workCustomer==='all'||(state.workCustomer==='internal'?!a.customerId:a.customerId===state.workCustomer)))}
function workLegend(){return '<div class="work-legend">'+data.members.map(m=>'<span>'+dot(m.id)+html(m.name)+'</span>').join('')+'<small>Dot = record creator · Owner shown on task</small></div>'}
function workTop(){const perspectives=[['calendar','▦','Calendar','When is it due?'],['gantt','▥','Gantt','How long will it take?'],['kanban','▣','Kanban','Where is it now?'],['sprints','◷','Sprint & backlog','What comes next?'],['workload','♙','Team workload','How is work spread?']];return '<div class="welcome"><div><h2>One set of work. Five perspectives.</h2><p class="subtext">Customer-linked activities stay in sync across your calendar, timeline, board, sprints and team workload.</p></div><button class="btn primary" data-action="add-activity">＋ New task</button></div><div class="perspective-nav" role="tablist" aria-label="Work perspectives">'+perspectives.map(([id,ic,title,q])=>'<button role="tab" aria-selected="'+(state.workMode===id)+'" class="perspective-tab '+(state.workMode===id?'active':'')+'" data-action="work-mode" data-mode="'+id+'"><b>'+ic+' '+title+'</b><small>'+q+'</small></button>').join('')+'</div>'}
function workControls(){return '<div class="work-toolbar"><div class="work-filterset">'+teamSelect('workTeam',state.workTeam)+customerSelect('workCustomer',state.workCustomer)+'<label class="switchline"><input id="workIncludeMeetings" type="checkbox" '+(state.workIncludeMeetings?'checked':'')+'> Include meetings & calls</label></div><span class="micro">Changes save locally and appear in every view.</span></div>'}
function renderWorkViews(){return workTop()+(state.workMode==='calendar'?renderCalendar():workControls()+(state.workMode==='gantt'?renderGantt():state.workMode==='kanban'?renderKanban():state.workMode==='sprints'?renderSprints():renderWorkload()))}
function taskCaption(a){return html(customer(a.customerId)?.name||'Internal')+' · '+html(member(a.ownerId).name)}
function tinyPriority(a){return '<span class="prio prio-'+html((a.priority||'Normal').toLowerCase())+'">'+html(a.priority||'Normal')+'</span>'}
function taskCard(a){return '<div class="agile-card '+(a.blocked||unfinishedDependency(a)?'is-blocked':'')+'" draggable="true" data-taskdrag="'+html(a.id)+'"><button class="agile-title" data-action="edit-activity" data-id="'+html(a.id)+'">'+dot(a.createdBy)+html(a.title)+'</button><div class="agile-meta">'+taskCaption(a)+'</div><div class="agile-facts">'+tinyPriority(a)+'<span>◷ '+html(niceDate(a.date,{day:'numeric',month:'short'}))+'</span><span>◇ '+Number(a.storyPoints||0)+' pts</span>'+(a.blocked?'<span class="blocked-mark">⚠ Blocked</span>':'')+(unfinishedDependency(a)?'<span class="blocked-mark" title="Waiting on '+html(unfinishedDependency(a).title)+'">⛓ Dependency</span>':'')+'</div><div class="agile-card-foot"><span>'+html(member(a.ownerId).name)+'</span><span class="agile-actions"><button data-action="stage-prev" data-id="'+html(a.id)+'" title="Move to previous stage" '+(stageOf(a)==='Backlog'?'disabled':'')+'>‹</button><button data-action="stage-next" data-id="'+html(a.id)+'" title="Advance stage" '+(stageOf(a)==='Done'?'disabled':'')+'>›</button></span></div></div>'}
function renderKanban(){const rows=workTasks().filter(a=>stageOf(a)!=='Cancelled');return '<section class="panel agile-panel"><div class="panel-header"><div><h2 class="panel-title">Kanban workflow</h2><p class="subtext">Drag tasks between stages, or use the ‹ › arrows. Review before marking complete.</p></div><span class="micro">'+rows.length+' tasks</span></div>'+workLegend()+'<div class="kanban-scroller"><div class="kanban-board">'+AGILE_STAGES.map((stage,i)=>{const items=rows.filter(a=>stageOf(a)===stage);return '<div class="kanban-column" data-drop-stage="'+html(stage)+'"><div class="kanban-heading"><span class="kanban-step">'+(i+1)+'</span><b>'+stage+'</b><span class="stage-count">'+items.length+'</span></div><div class="kanban-items">'+(items.map(taskCard).join('')||'<div class="kanban-empty">Drop a task here</div>')+'</div><button class="add-in-column" data-action="add-stage-task" data-stage="'+html(stage)+'">＋ Add task</button></div>'}).join('')+'</div></div></section>'}
function renderGantt(){const start=shiftDays(state.workAnchor,-((dateObj(state.workAnchor).getDay()+6)%7)),span=state.workSpan;const end=shiftDays(start,span-1);const px=31;const rows=workTasks().filter(a=>stageOf(a)!=='Cancelled').sort((a,b)=>(a.startDate||a.date).localeCompare(b.startDate||b.date)||a.date.localeCompare(b.date));const ticks=Array.from({length:span},(_,i)=>shiftDays(start,i));const head=ticks.map(d=>'<div class="gantt-date '+([0,6].includes(dateObj(d).getDay())?'weekend ':'')+(d===TODAY?'gantt-today':'')+'" title="'+html(niceDate(d))+'">'+(dateObj(d).getDate()===1?'<b>'+html(niceDate(d,{month:'short'}))+'</b>':'')+'<small>'+html(niceDate(d,{weekday:'short'}).slice(0,1))+'</small><strong>'+Number(d.slice(8))+'</strong></div>').join('');const lines=rows.map(a=>{const i0=dayDiff(a.startDate||a.date,start),i1=dayDiff(a.date,start),inside=i1>=0&&i0<span,begin=Math.max(0,i0),finish=Math.min(span-1,i1),width=Math.max(1,(finish-begin+1)*px-6),isLate=isOverdue(a);return '<div class="gantt-task-row"><div class="gantt-name"><button data-action="edit-activity" data-id="'+html(a.id)+'" title="Edit task">'+dot(a.createdBy)+html(a.title)+'</button><small>'+taskCaption(a)+' · '+tinyPriority(a)+'</small></div><div class="gantt-track" style="width:'+span*px+'px">'+(inside?'<button class="gantt-bar '+(isLate?'late ':'')+(a.blocked||unfinishedDependency(a)?'blocked ':'')+'" style="left:'+(begin*px+3)+'px;width:'+width+'px;--task-color:'+html(member(a.ownerId).color)+'" title="'+html(a.title)+' · '+html(a.startDate)+' to '+html(a.date)+' · '+html(member(a.ownerId).name)+'" data-action="edit-activity" data-id="'+html(a.id)+'"><span style="width:'+Math.min(100,a.progress||0)+'%"></span><b>'+html(a.title)+'</b></button>':'')+'</div></div>'}).join('');return '<section class="panel agile-panel"><div class="panel-header gantt-panel-head"><div><h2 class="panel-title">Gantt timeline</h2><p class="subtext">Start-to-due spans, progress, owners, customer links and blockers.</p></div><div class="gantt-controls"><button class="icon-btn" data-action="gantt-prev" aria-label="Previous two weeks">‹</button><button class="btn mini" data-action="gantt-today">Today</button><button class="icon-btn" data-action="gantt-next" aria-label="Next two weeks">›</button><select class="filter-input" id="ganttSpan" aria-label="Timeline range"><option value="21" '+(span===21?'selected':'')+'>3 weeks</option><option value="35" '+(span===35?'selected':'')+'>5 weeks</option><option value="56" '+(span===56?'selected':'')+'>8 weeks</option></select></div></div>'+workLegend()+'<div class="gantt-scroll"><div class="gantt-table" style="width:'+(280+span*px)+'px"><div class="gantt-head"><div class="gantt-left-label">Task · customer · owner</div><div class="gantt-days" style="width:'+span*px+'px">'+head+'</div></div>'+(lines||'<div class="gantt-empty">No tasks match these filters. Create a task or include meetings and calls.</div>')+'</div></div><div class="gantt-footer">'+html(niceDate(start))+' – '+html(niceDate(end))+' · '+rows.length+' tasks · <span class="blocked-mark">Striped bar = blocked</span> · Red outline = overdue</div></section>'}

function exportCsv(which){const isC=which==='customers';const cols=isC?['Customer','Contact','Email','Phone','Status','Notes']:['Start date','Due date','Time','Title','Type','Customer','Created by','Assigned to','Status','Agile stage','Priority','Story points','Progress %','Sprint','Blocked','Dependency','Location','Notes'];let rows=isC?data.customers.map(c=>[c.name,c.contact,c.email,c.phone,c.status,c.notes]):data.activities.map(a=>[a.startDate,a.date,a.time,a.title,a.type,customer(a.customerId)?.name||'',member(a.createdBy).name,member(a.ownerId).name,a.status,stageOf(a),a.priority,a.storyPoints,a.progress,sprint(a.sprintId)?.name||'',a.blocked?'Yes':'No',data.activities.find(x=>x.id===a.dependsOn)?.title||'',a.location,a.notes]);download('orbit_'+which+'_'+TODAY+'.csv','\ufeff'+[cols,...rows].map(r=>r.map(csvValue).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function escapeIcs(s){return String(s??'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function exportIcs(){const fmt=s=>s.replaceAll('-','');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Orbit Team Organiser//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];for(const a of data.activities.filter(a=>a.status!=='Cancelled')){let ds=fmt(a.date);lines.push('BEGIN:VEVENT','UID:'+escapeIcs(a.id)+'@orbit-local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'').replace('.000',''),'SUMMARY:'+escapeIcs(a.title));if(a.time){const time=a.time.replace(':','')+'00';let next=new Date(dateObj(a.date));next.setHours(Number(a.time.slice(0,2)),Number(a.time.slice(3,5))+60);lines.push('DTSTART:'+ds+'T'+time,'DTEND:'+localDate(next).replaceAll('-','')+'T'+String(next.getHours()).padStart(2,'0')+String(next.getMinutes()).padStart(2,'0')+'00')}else{lines.push('DTSTART;VALUE=DATE:'+ds,'DTEND;VALUE=DATE:'+fmt(shiftDays(a.date,1)))}lines.push('DESCRIPTION:'+escapeIcs('Customer: '+(customer(a.customerId)?.name||'Internal')+'\nType: '+a.type+'\nCreated by: '+member(a.createdBy).name+'\nOwner: '+member(a.ownerId).name+'\nStatus: '+a.status+'\n'+a.notes));if(a.location)lines.push('LOCATION:'+escapeIcs(a.location));lines.push('END:VEVENT')}lines.push('END:VCALENDAR');download('orbit_calendar_'+TODAY+'.ics',lines.join('\r\n')+'\r\n','text/calendar;charset=utf-8')}
function act(name,el){const id=el.dataset.id,date=el.dataset.date;switch(name){case 'nav':state.view=el.dataset.view;render();break;case 'work-mode':state.workMode=el.dataset.mode;render();break;case 'gantt-prev':state.workAnchor=shiftDays(state.workAnchor,-14);render();break;case 'gantt-next':state.workAnchor=shiftDays(state.workAnchor,14);render();break;case 'gantt-today':state.workAnchor=TODAY;render();break;case 'add-stage-task':activityModal(null,null,null,el.dataset.stage);break;case 'stage-prev':case 'stage-next':{const a=data.activities.find(x=>x.id===id);if(a){let k=AGILE_STAGES.indexOf(stageOf(a))+(name==='stage-next'?1:-1);if(k>=0&&k<AGILE_STAGES.length)changeStage(id,AGILE_STAGES[k])}break}case 'set-stage':changeStage(id,el.dataset.stage);break;case 'new-sprint':sprintModal();break;case 'edit-sprint':sprintModal(id);break;case 'choose-sprint':state.workSprint=id;render();break;case 'assign-sprint':{const a=data.activities.find(x=>x.id===id);if(a){a.sprintId=el.dataset.sprint||'';commit(a.sprintId?'Added to sprint':'Moved to backlog')}break}case 'delete-sprint':if(confirm('Delete this sprint? Assigned tasks will return to the backlog.')){data.sprints=data.sprints.filter(s=>s.id!==id);data.activities.forEach(a=>{if(a.sprintId===id)a.sprintId=''});state.workSprint='';closeModal();commit('Sprint deleted; tasks kept')}break;case 'add-activity':activityModal(null,date,el.dataset.customer);break;case 'edit-activity':activityModal(id);break;case 'add-customer':customerModal();break;case 'edit-customer':customerModal(id);break;case 'view-customer':state.detailId=id;renderDrawer();break;case 'edit-member':memberModal(id);break;case 'select-day':state.selectedDate=date;if(state.calendarMode==='month')state.monthCursor=date.slice(0,7);render();break;case 'today':state.selectedDate=TODAY;state.monthCursor=TODAY.slice(0,7);render();break;case 'prev-period':case 'next-period':{const n=name==='next-period'?1:-1;if(state.calendarMode==='month'){state.monthCursor=monthDelta(state.monthCursor,n);state.selectedDate=state.monthCursor+'-01'}else{state.selectedDate=shiftDays(state.selectedDate,n*7);state.monthCursor=state.selectedDate.slice(0,7)}render();break}case 'mode':state.calendarMode=el.dataset.mode;render();break;case 'toggle-done':{const a=data.activities.find(a=>a.id===id);if(a){a.stage=a.status==='Done'?'To do':'Done';a.status=fromStage(a.stage);a.progress=PROGRESS_BY_STAGE[a.stage];commit(a.status==='Done'?'Marked as done':'Reopened task')}break}case 'close-modal':closeModal();break;case 'close-drawer':closeDrawer();break;case 'close-modal-backdrop':closeModal();break;case 'close-drawer-backdrop':closeDrawer();break;case 'delete-activity':{if(confirm('Delete this activity permanently?')){data.activities=data.activities.filter(a=>a.id!==id);data.activities.forEach(t=>{if(t.dependsOn===id)t.dependsOn=''});closeModal();commit('Activity deleted')}break}case 'delete-customer':{const n=data.activities.filter(a=>a.customerId===id).length;if(confirm('Delete this customer? '+n+' linked activities will remain, but their customer association will be cleared. All customer notes will be deleted.')){data.customers=data.customers.filter(c=>c.id!==id);data.activities.forEach(a=>{if(a.customerId===id)a.customerId=''});data.notes=data.notes.filter(n=>n.customerId!==id);closeModal();closeDrawer();commit('Customer removed; activities retained')}break}case 'save-note':{let input=document.getElementById('customerQuickNote'),val=input?.value.trim();if(!val){toast('Write a note first');break}data.notes.push({id:uid(),customerId:el.dataset.customer,text:val,date:localDateTime(new Date()),userId:data.activeUserId});commit('Customer note added');break}case 'delete-note':{if(confirm('Delete this customer note?')){data.notes=data.notes.filter(n=>n.id!==id);commit('Note removed')}break}case 'export-json':download('orbit_backup_'+TODAY+'.json',JSON.stringify(data,null,2),'application/json');toast('Backup downloaded');break;case 'import-json':document.getElementById('importFile').click();break;case 'export-csv-customers':exportCsv('customers');toast('Customer CSV downloaded');break;case 'export-csv-activities':exportCsv('activities');toast('Activities CSV downloaded');break;case 'export-ics':exportIcs();toast('Calendar file downloaded');break;case 'clear-sample':if(confirm('Remove example customers, activities and notes? Your team names will remain.')){data=resetEmpty();state.detailId=null;commit('Empty workspace ready')}break;case 'clear-all':if(confirm('Delete all customers, activities and notes from this browser? Export a backup first if you want to retain them.')){data=resetEmpty();state.detailId=null;commit('Workspace cleared')}break;case 'reset-sample':if(confirm('Replace all current records and team names with example data? This cannot be undone without a backup.')){data=mkSample();state.detailId=null;state.teamFilter='all';state.selectedDate=TODAY;state.monthCursor=TODAY.slice(0,7);commit('Example workspace loaded')}break;}}
// Delegated controls. All edits are synced to the shared workspace.
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if((action==='close-modal-backdrop'||action==='close-drawer-backdrop')&&e.target!==el)return;e.preventDefault();act(action,el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('modalRoot').innerHTML)closeModal();else if(state.detailId)closeDrawer()}if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('day')){e.preventDefault();act('select-day',e.target)}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='activeMember'){if(cloudReady){toast('Your team colour is assigned to your login');render();return}data.activeUserId=e.target.value;save();render();if(state.detailId)renderDrawer();toast('Now working as '+member(data.activeUserId).name)}if(id==='calendarTeamFilter'||id==='activityTeam'){state.teamFilter=e.target.value;render()}if(id==='customerStatus'){state.customerStatus=e.target.value;render()}if(id==='activityType'){state.activityFilter=e.target.value;render()}if(id==='workTeam'){state.workTeam=e.target.value;render()}if(id==='workCustomer'){state.workCustomer=e.target.value;render()}if(id==='ganttSpan'){state.workSpan=Number(e.target.value);render()}if(id==='workIncludeMeetings'){state.workIncludeMeetings=e.target.checked;render()}});
document.addEventListener('input',e=>{if(e.target.id==='customerSearch'||e.target.id==='activitySearch'){const id=e.target.id;const position=e.target.selectionStart;if(id==='customerSearch')state.customerQuery=e.target.value;else state.activityQuery=e.target.value;render();const input=document.getElementById(id);input?.focus();input?.setSelectionRange(position,position)}});
let draggedTaskId=null;document.addEventListener('dragstart',e=>{const card=e.target.closest('[data-taskdrag]');if(card){draggedTaskId=card.dataset.taskdrag;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedTaskId)}});document.addEventListener('dragover',e=>{const col=e.target.closest('[data-drop-stage]');if(col){e.preventDefault();e.dataTransfer.dropEffect='move'}});document.addEventListener('drop',e=>{const col=e.target.closest('[data-drop-stage]');if(!col)return;e.preventDefault();const id=draggedTaskId||e.dataTransfer.getData('text/plain');draggedTaskId=null;changeStage(id,col.dataset.dropStage)});document.addEventListener('dragend',()=>draggedTaskId=null);
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const candidate=JSON.parse(await file.text());if(!validShape(candidate))throw Error('Not a valid Orbit team backup (five team members and required records expected).');if(confirm('Import this backup? It will replace the SHARED workspace for all team members. Export a backup first.')){candidate.members=candidate.members.map((m,i)=>({...m,color:COLORS[i]}));candidate.activeUserId=candidate.members.some(m=>m.id===candidate.activeUserId)?candidate.activeUserId:candidate.members[0].id;data=normaliseAgile(candidate);closeDrawer();state.selectedDate=TODAY;state.monthCursor=TODAY.slice(0,7);state.teamFilter='all';commit('Backup imported successfully')}}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}});
// ORBIT V3: shared Supabase workspace, authenticated and allowlisted users only.
const CLOUD_BACKUP_KEY = 'orbit_v3_pending_sync';
let cloudClient = null, cloudReady = false, cloudOpening = false, cloudWriting = false;
let cloudRevision = 0, cloudBase = null, cloudSlot = 0, cloudEmail = '', cloudQueue = false;
let cloudStatus = 'Not connected', cloudSyncTimer = null, cloudAuthMode = 'login';
let cloudIsAdmin=false, cloudRoster=[];
const deepCopy = value => JSON.parse(JSON.stringify(value));
const sameJson = (a,b) => JSON.stringify(a) === JSON.stringify(b);
function cloudCanonical(value){
  const out=deepCopy(value);out.activeUserId='m1';out.isSample=false;
  return out;
}
function cloudEmpty(){
  return {version:2,members:COLORS.map((color,i)=>({id:'m'+(i+1),name:i===0?'You':'Member '+(i+1),color})),customers:[],activities:[],notes:[],sprints:[],activeUserId:'m1',isSample:false};
}
function cloudBadge(){
  const el=document.getElementById('orbitCloudTools');
  if(!el)return;
  if(!cloudReady){el.innerHTML='';return}
  const e=html(cloudEmail);
  el.innerHTML='<div class="orbit-cloud-status"><span class="dot" style="--dot:'+(cloudStatus.includes('saved')?'#26A99B':'#E8954F')+'"></span><span>'+html(cloudStatus)+'</span></div><span class="orbit-cloud-email" title="'+e+'">'+e+'</span>'+(cloudIsAdmin?'<a class="btn mini" href="./admin.html">⚙ Admin</a>':'')+'<button type="button" class="btn mini" id="orbitSignOut">Sign out</button>';
  const memberPick=document.getElementById('activeMember');
  if(memberPick){memberPick.disabled=true;memberPick.title='Your identity and colour are assigned to your login';}
}
function cloudStatusSet(s){cloudStatus=s;cloudBadge()}
function cloudAuthMessage(message){
  const el=document.getElementById('orbitAuthMessage');
  if(el){el.textContent=message;el.hidden=!message;}
}
function cloudAuthForm(mode='login'){
  cloudAuthMode=mode;
  document.body.classList.remove('orbit-ready');
  const root=document.getElementById('cloudAuthRoot');
  root.hidden=false;
  if(mode==='setup'){
    root.innerHTML='<div class="orbit-auth-card"><div class="orbit-auth-mark">✦</div><h1>Connect Orbit to Supabase</h1><p>The site owner must put the <strong>Project URL</strong> and <strong>publishable key</strong> into <code>orbit-config.js</code>, then redeploy this folder to Netlify.</p><p>Run <code>supabase_setup.sql</code> in the Supabase SQL Editor and add each user to <code>orbit_allowed_emails</code>.</p><p class="orbit-auth-note">Never place a secret or service-role key in the website files.</p></div>';
    return;
  }
  root.innerHTML='<div class="orbit-auth-card"><div class="orbit-auth-mark">✦</div><h1>Orbit Team Organiser</h1><p>Sign in to the private customer, calendar and Agile workspace.</p><form id="orbitLoginForm"><label for="orbitEmail">Email</label><input id="orbitEmail" type="email" required autocomplete="email" placeholder="you@company.com"><label for="orbitPassword">Password</label><input id="orbitPassword" type="password" autocomplete="current-password" placeholder="Your password"><button class="btn primary orbit-auth-primary" type="submit">Sign in</button></form><button type="button" class="btn orbit-auth-secondary" id="orbitEmailLink">Email me a sign-in link instead</button><p class="orbit-auth-message" id="orbitAuthMessage" hidden></p><button class="btn orbit-auth-secondary" type="button" id="orbitDifferentAccount">Use a different account</button><p class="orbit-auth-note">Access is restricted to invited addresses added by the project administrator. Your team colour is linked to your authorised account, not selected manually.</p></div>';
  document.getElementById('orbitDifferentAccount').addEventListener('click',async()=>{if(cloudClient){await cloudClient.auth.signOut()}cloudAuthForm('login')});
  document.getElementById('orbitLoginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const email=document.getElementById('orbitEmail').value.trim(),password=document.getElementById('orbitPassword').value;
    if(!password){cloudAuthMessage('Enter your password or use the email sign-in link.');return}
    cloudAuthMessage('Signing in…');
    const {error}=await cloudClient.auth.signInWithPassword({email,password});
    if(error)cloudAuthMessage('Sign-in failed: '+error.message);
    else await cloudOpen();
  });
  document.getElementById('orbitEmailLink').addEventListener('click',async()=>{
    const email=document.getElementById('orbitEmail').value.trim();
    if(!email){cloudAuthMessage('Enter your email address first.');return}
    cloudAuthMessage('Sending your sign-in link…');
    const {error}=await cloudClient.auth.signInWithOtp({email, options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});
    cloudAuthMessage(error?('Could not send link: '+error.message):'Check your email for the sign-in link. It may take a moment to arrive.');
  });
}
function cloudSetData(remote){
  data=normaliseAgile(deepCopy(remote));
  if(!validShape(data))throw new Error('The remote workspace has an invalid data format.');
  data.activeUserId=data.members[cloudSlot-1].id;
  data.isSample=false;
  save();render();if(state.detailId)renderDrawer();cloudBadge();
}
async function cloudRead(){
  const {data:row,error}=await cloudClient.from('orbit_workspace').select('payload,revision').eq('id','main').single();
  if(error)throw new Error('Could not read shared workspace: '+error.message);
  return row;
}
function cloudMerge(base,local,remote){
  const merged=deepCopy(remote), conflicts=[];
  for(const listName of ['members','customers','activities','notes','sprints']){
    const baseArr=Array.isArray(base[listName])?base[listName]:[];
    const localArr=Array.isArray(local[listName])?local[listName]:[];
    const remoteArr=Array.isArray(remote[listName])?remote[listName]:[];
    const bm=new Map(baseArr.map(x=>[x.id,x])),lm=new Map(localArr.map(x=>[x.id,x])),rm=new Map(remoteArr.map(x=>[x.id,x]));
    const ids=new Set([...bm.keys(),...lm.keys()]);
    for(const id of ids){
      const before=bm.get(id),after=lm.get(id),server=rm.get(id);
      if(sameJson(before,after))continue;
      if(!sameJson(before,server)&&!sameJson(after,server)){conflicts.push(listName+' / '+id);continue;}
      if(after===undefined)rm.delete(id);else rm.set(id,after);
    }
    merged[listName]=Array.from(rm.values());
  }
  if(conflicts.length)throw new Error('The same '+conflicts.length+' record(s) were changed by another user. Export your local JSON backup before reloading.');
  return cloudCanonical(merged);
}
async function cloudWrite(){
  if(!cloudReady)return;
  if(cloudWriting){cloudQueue=true;return}
  cloudWriting=true;
  try{
    let attempts=0;
    do{
      cloudQueue=false;
      const latest=cloudCanonical(data);
      if(sameJson(latest,cloudBase)){cloudStatusSet('Cloud saved');break}
      cloudStatusSet('Syncing changes…');
      try{localStorage.setItem(CLOUD_BACKUP_KEY,JSON.stringify(data))}catch(_e){}
      const {data:newRevision,error}=await cloudClient.rpc('orbit_write_workspace',{
        p_expected_revision:cloudRevision,p_payload:latest
      });
      if(!error){
        cloudRevision=Number(newRevision);cloudBase=deepCopy(latest);
        if(sameJson(latest,cloudCanonical(data))){try{localStorage.removeItem(CLOUD_BACKUP_KEY)}catch(_e){}}
        cloudStatusSet('Cloud saved');
      }else if(/ORBIT_REVISION_CONFLICT|40001|could not serialize|revision conflict/i.test(error.message||'')&&attempts<3){
        attempts++;
        const row=await cloudRead();
        const server=validShape(row.payload)?row.payload:cloudEmpty();
        const merged=cloudMerge(cloudBase,cloudCanonical(data),server);
        cloudBase=cloudCanonical(server);cloudRevision=Number(row.revision);
        cloudSetData(merged);
        cloudQueue=true;
      }else throw new Error(error.message);
    }while(cloudQueue||!sameJson(cloudCanonical(data),cloudBase));
  }catch(err){
    cloudStatusSet('Unsaved changes — export backup');
    toast('Cloud save failed: '+err.message+' Export a JSON backup.');
    console.error('Orbit cloud save',err);
  }finally{cloudWriting=false}
}
async function cloudRefresh(){
  if(cloudReady){try{await cloudLoadRoster()}catch(e){console.warn('Orbit roster refresh',e)}}
  if(!cloudReady||cloudWriting)return;
  try{
    const row=await cloudRead();
    if(Number(row.revision)===cloudRevision)return;
    const remote=validShape(row.payload)?cloudCanonical(row.payload):cloudEmpty();
    if(!sameJson(cloudCanonical(data),cloudBase)){
      cloudQueue=true;await cloudWrite();return;
    }
    cloudRevision=Number(row.revision);cloudBase=deepCopy(remote);
    cloudSetData(remote);cloudStatusSet('Cloud saved');
    toast('Updated with team changes');
  }catch(err){console.warn('Orbit sync refresh failed',err);cloudStatusSet('Reconnecting…')}
}
async function cloudLoadRoster(){
  if(!cloudClient)return;
  const {data:roster,error}=await cloudClient.rpc('orbit_team_roster');
  if(error)throw new Error('Could not load team membership: '+error.message);
  const next=Array.isArray(roster)?roster:[];
  const changed=!sameJson(next,cloudRoster);
  cloudRoster=next;
  if(cloudReady&&changed)render();
}
async function cloudOpen(){
  if(cloudOpening||cloudReady)return;
  cloudOpening=true;
  try{
    const {data:sessionInfo,error:sessionError}=await cloudClient.auth.getUser();
    if(sessionError||!sessionInfo?.user)throw new Error('Session expired. Please sign in again.');
    const user=sessionInfo.user, email=(user.email||'').toLowerCase();
    const {data:membership,error:memberError}=await cloudClient.from('orbit_allowed_emails').select('member_slot,role,is_active').eq('email',email).single();
    if(memberError||!membership||!membership.is_active)throw new Error('This email is not an active Orbit member. Ask the administrator to grant access.');
    cloudSlot=Number(membership.member_slot);cloudEmail=email;cloudIsAdmin=membership.role==='admin';
    await cloudLoadRoster();
    if(!(cloudSlot>=1&&cloudSlot<=5))throw new Error('Assigned team slot must be 1–5.');
    let row=await cloudRead();
    if(!validShape(row.payload)){
      const fresh=cloudEmpty();
      const {data:rev,error:seedError}=await cloudClient.rpc('orbit_write_workspace',{p_expected_revision:Number(row.revision),p_payload:fresh});
      if(seedError&&!/ORBIT_REVISION_CONFLICT|40001/i.test(seedError.message||''))throw Error(seedError.message);
      row=await cloudRead();
    }
    cloudRevision=Number(row.revision);cloudBase=cloudCanonical(row.payload);
    cloudReady=true;document.body.classList.add('orbit-ready');document.getElementById('cloudAuthRoot').hidden=true;
    cloudSetData(cloudBase);cloudStatusSet('Cloud saved');
    clearInterval(cloudSyncTimer);cloudSyncTimer=setInterval(cloudRefresh,15000);
    // Do not automatically upload V2's local records; import only on user request.
  }catch(err){
    cloudReady=false;document.body.classList.remove('orbit-ready');
    cloudAuthForm('login');cloudAuthMessage(err.message);
    console.error('Orbit cloud login',err);
  }finally{cloudOpening=false}
}
async function cloudBoot(){
  const cfg=window.ORBIT_CONFIG||{};
  if(!/^https:\/\/[\w.-]+\.supabase\.co\/?$/.test(cfg.url||'')||!cfg.publishableKey||cfg.publishableKey.startsWith('PASTE_')||!window.supabase){
    cloudAuthForm('setup');return;
  }
  cloudClient=window.supabase.createClient(cfg.url,cfg.publishableKey,{
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
  });
  cloudClient.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){cloudReady=false;cloudIsAdmin=false;cloudRoster=[];clearInterval(cloudSyncTimer);cloudAuthForm('login')}
    if(event==='SIGNED_IN'&&session&&!cloudReady&&!cloudOpening)setTimeout(cloudOpen,0);
  });
  const {data:sessionInfo}=await cloudClient.auth.getSession();
  if(sessionInfo?.session)await cloudOpen();else cloudAuthForm('login');
  document.getElementById('orbitCloudTools').addEventListener('click',async e=>{
    if(e.target.id==='orbitSignOut'){
      if(cloudWriting||!sameJson(cloudCanonical(data),cloudBase)){
        alert('Some changes are still unsaved. Export a backup and complete sync before signing out.');return;
      }
      cloudReady=false;clearInterval(cloudSyncTimer);await cloudClient.auth.signOut();cloudAuthForm('login');
    }
  });
}

data=load();render();
cloudBoot();
})();
