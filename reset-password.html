<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f4"><title>Orbit & FOREWARD | Set a new password</title><style>
:root{font:15px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#233a32;background:#f6f7f4}*{box-sizing:border-box}body{margin:0;padding:20px;min-height:100dvh;display:grid;place-items:center}.card{width:min(470px,100%);background:white;border:1px solid #dfe9df;border-radius:22px;padding:30px;box-shadow:0 15px 45px #233a3214}h1{font-size:28px;line-height:1.2;letter-spacing:-.7px;margin:12px 0}p{color:#627568;margin:0 0 18px}.brand{font-weight:850;letter-spacing:-.7px;color:#315f4e}label{font-size:13px;font-weight:750;display:block;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #cbdace;border-radius:11px;min-height:47px;font:inherit}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #8ebc9a;outline-offset:3px}.field{margin:14px 0}button{font:inherit;border:0;border-radius:11px;padding:12px 17px;min-height:47px;background:#315f4e;color:white;font-weight:760;cursor:pointer;width:100%}button:disabled{opacity:.55;cursor:wait}.notice{padding:12px;border-radius:10px;background:#edf4ee;font-size:13px}.error{background:#ffeeed;color:#a43030}a{color:#315f4e;font-weight:750}small{font-size:12px;color:#77867a} .hidden{display:none!important}
</style></head><body><main class="card"><div class="brand">FOREWARD <span style="color:#819588">/ Orbit</span></div><h1>Choose a new password</h1><p>This is your private password reset page. Your administrator cannot see your old or new password.</p><p id="status" class="notice" aria-live="polite">Checking your secure recovery link…</p><form id="resetForm" class="hidden"><div class="field"><label for="password">New password (at least 12 characters)</label><input id="password" type="password" autocomplete="new-password" required minlength="12"></div><div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" required minlength="12"></div><button id="save" type="submit">Save my new password</button></form><p id="done" class="hidden"><a href="./index.html">Open Orbit</a> · <a href="./foreward-full.html">Open FOREWARD</a></p><small>If your link expired, ask the administrator to send another recovery email.</small></main><script src="./orbit-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cfg=window.ORBIT_CONFIG||{};let client=null,ready=false;
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function showForm(){ready=true;$('resetForm').classList.remove('hidden');status('Your secure link is valid. Set your new password below.');$('password').focus()}
async function init(){if(!window.supabase||!cfg.url||!cfg.publishableKey){status('Sign-in service unavailable. Please retry later.',true);return}client=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)showForm()});const res=await client.auth.getSession();if(res.error){status('Could not verify recovery link: '+res.error.message,true);return}if(res.data.session){showForm();return}status('This link has expired or was not recognised. Request a new recovery email from the administrator.',true)}
$('resetForm').addEventListener('submit',async e=>{e.preventDefault();if(!ready||!client)return;const p=$('password').value,c=$('confirm').value;if(p.length<12){status('Please choose at least 12 characters.',true);return}if(p!==c){status('The two passwords do not match.',true);return}const b=$('save');b.disabled=true;const r=await client.auth.updateUser({password:p});b.disabled=false;if(r.error){status('Could not update password: '+r.error.message,true);return}$('password').value='';$('confirm').value='';$('resetForm').classList.add('hidden');$('done').classList.remove('hidden');status('Your password has been changed. You can return to Orbit or FOREWARD.');await client.auth.signOut()});init().catch(e=>status('Recovery failed: '+e.message,true));
})();
</script></body></html>
